<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Motion Effects Catalog</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{font-family:system-ui,sans-serif;margin:0;background:#101514;color:#eef5f2}
    header{padding:28px;position:sticky;top:0;z-index:5;background:#101514f2;border-bottom:1px solid #26332f}
    header h1{margin:0 0 8px}
    header p{margin:0 0 18px;color:#b8c8c3}
    select{padding:9px 12px;margin:0 8px 0 0;border-radius:8px;background:#eef5f2;color:#17201e;border:0}
    main{padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;max-width:1500px;margin:auto}
    article{padding:18px;border:1px solid #33413d;border-radius:16px;background:#17201e}
    article h2,article h3{margin-top:0}
    .implemented{grid-column:1/-1;border-color:#49bca8;cursor:pointer;outline:none}
    .implemented:focus-visible{box-shadow:0 0 0 3px #49bca8}
    .preview-shell{overflow:hidden;border-radius:12px;background:white;border:1px solid #33413d}
    iframe{display:block;width:100%;height:clamp(380px,58vh,640px);border:0;background:white;pointer-events:none}
    .implemented-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:14px}
    .status{font:700 12px/1.2 ui-monospace,monospace;letter-spacing:.04em;color:#91e4d3}
    .open-demo{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:9px;background:#49bca8;color:#071513;text-decoration:none;font-weight:750}
    .open-demo:focus-visible{outline:3px solid #eef5f2;outline-offset:3px}
    .planned{padding:15px;min-height:0}
    .planned h3{font-size:15px;margin-bottom:8px}
    .planned p{font-size:13px;color:#a8bab4;margin:0 0 10px}
    .planned .status{color:#d6c98e}
    @media(max-width:640px){header{padding:20px}main{padding:16px}.implemented{padding:14px}iframe{height:360px}}
  </style>
</head>
<body>
  <header>
    <h1>MOTION-SYSTEM-001</h1>
    <p>Two implemented candidates await human review. Planned items are specifications only.</p>
    <label>State <select id="kind"><option value="all">All</option><option value="implemented">Implemented</option><option value="planned">Planned</option></select></label>
    <label>Family <select id="family"><option value="all">All families</option></select></label>
  </header>
  <main id="grid">
    <article class="implemented" data-kind="implemented" data-family="data_status" data-demo-href="../effects/data/STATISTICS-COUNTER-STATIC-SUFFIX-001/EFFECT_DEMO.html" role="link" tabindex="0" aria-label="Open full Statistics Counter demo">
      <h2>Statistics Counter</h2>
      <div class="preview-shell"><iframe title="Statistics counter preview" scrolling="no" tabindex="-1" src="../effects/data/STATISTICS-COUNTER-STATIC-SUFFIX-001/EFFECT_DEMO.html"></iframe></div>
      <div class="implemented-footer"><span class="status">HUMAN_REVIEW_PENDING</span><a class="open-demo" href="../effects/data/STATISTICS-COUNTER-STATIC-SUFFIX-001/EFFECT_DEMO.html" target="_blank" rel="noopener noreferrer">Abrir demo completo</a></div>
    </article>
    <article class="implemented" data-kind="implemented" data-family="scroll_story" data-demo-href="../effects/progress/ROADMAP-VERTICAL-PROGRESS-001/EFFECT_DEMO.html" role="link" tabindex="0" aria-label="Open full Vertical Roadmap demo">
      <h2>Vertical Roadmap</h2>
      <div class="preview-shell"><iframe title="Vertical roadmap preview" scrolling="no" tabindex="-1" src="../effects/progress/ROADMAP-VERTICAL-PROGRESS-001/EFFECT_DEMO.html"></iframe></div>
      <div class="implemented-footer"><span class="status">HUMAN_REVIEW_PENDING</span><a class="open-demo" href="../effects/progress/ROADMAP-VERTICAL-PROGRESS-001/EFFECT_DEMO.html" target="_blank" rel="noopener noreferrer">Abrir demo completo</a></div>
    </article>
  </main>
  <script>
    const groups=[{"family":"feedback","level":"PATTERN","industry_frequency":"CORE","effects":[{"id":"INDUSTRY-HOVER_LIFT-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-PRESS_COMPRESSION-001","status":"SPECIFIED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-TOGGLE_THUMB-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-FOCUS_REVEAL-001","status":"SPECIFIED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-ICON_STATE_MORPH-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-BUTTON_LOADING-001","status":"SPECIFIED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-VALIDATION_FEEDBACK-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-COPY_CONFIRMATION-001","status":"SPECIFIED","formula_required":false,"priority":"A"}]},{"family":"entrance_exit","level":"PATTERN","industry_frequency":"CORE","effects":[{"id":"INDUSTRY-FADE-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-FADE_UP-001","status":"SPECIFIED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-FADE_DOWN-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-SLIDE_FROM_EDGE-001","status":"SPECIFIED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-SCALE_FADE-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-CLIP_REVEAL-001","status":"SPECIFIED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-MASK_REVEAL-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-IMAGE_WIPE-001","status":"SPECIFIED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-STAGGERED_ENTRANCE-001","status":"RESEARCHED","formula_required":false,"priority":"A"}]},{"family":"navigation","level":"COMPOSITION","industry_frequency":"COMMON","effects":[{"id":"INDUSTRY-PAGE_CROSSFADE-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-SHARED_AXIS-001","status":"SPECIFIED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-SHARED_ELEMENT-001","status":"RESEARCHED","formula_required":false,"priority":"A"},{"id":"INDUSTRY-CONTAINER_TRANSFORM-001","status":"SPECIFIED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-DRAWER_TRANSITION-001","status":"RESEARCHED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-MODAL_TRANSITION-001","status":"SPECIFIED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-TAB_TRANSITION-001","status":"RESEARCHED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-CAROUSEL_TRANSITION-001","status":"SPECIFIED","formula_required":false,"priority":"B"}]},{"family":"layout","level":"PATTERN","industry_frequency":"COMMON","effects":[{"id":"INDUSTRY-ACCORDION_EXPAND-001","status":"RESEARCHED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-COLLAPSIBLE_SECTION-001","status":"SPECIFIED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-LIST_INSERT-001","status":"RESEARCHED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-LIST_REMOVE-001","status":"SPECIFIED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-LIST_REORDER-001","status":"RESEARCHED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-FILTER_TRANSITION-001","status":"SPECIFIED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-SORT_TRANSITION-001","status":"RESEARCHED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-GRID_REFLOW-001","status":"SPECIFIED","formula_required":false,"priority":"B"}]},{"family":"data_status","level":"COMPOSITION","industry_frequency":"COMMON","effects":[{"id":"INDUSTRY-STATISTICS_COUNTER-001","status":"RESEARCHED","formula_required":true,"priority":"B"},{"id":"INDUSTRY-PROGRESS_BAR-001","status":"SPECIFIED","formula_required":true,"priority":"B"},{"id":"INDUSTRY-PROGRESS_RING-001","status":"RESEARCHED","formula_required":true,"priority":"B"},{"id":"INDUSTRY-LINE_CHART_DRAW-001","status":"SPECIFIED","formula_required":true,"priority":"B"},{"id":"INDUSTRY-BAR_CHART_GROW-001","status":"RESEARCHED","formula_required":true,"priority":"B"},{"id":"INDUSTRY-DONUT_REVEAL-001","status":"SPECIFIED","formula_required":true,"priority":"B"},{"id":"INDUSTRY-SKELETON_LOADING-001","status":"RESEARCHED","formula_required":false,"priority":"B"},{"id":"INDUSTRY-SPINNER-001","status":"SPECIFIED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-LOADING_DOTS-001","status":"RESEARCHED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-TOAST_ENTRANCE-001","status":"SPECIFIED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-SUCCESS_CONFIRMATION-001","status":"RESEARCHED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-ERROR_STATE-001","status":"SPECIFIED","formula_required":false,"priority":"C"}]},{"family":"scroll_story","level":"COMPOSITION","industry_frequency":"COMMON","effects":[{"id":"INDUSTRY-SCROLL_REVEAL-001","status":"RESEARCHED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-PARALLAX-001","status":"SPECIFIED","formula_required":true,"priority":"C"},{"id":"INDUSTRY-STICKY_SCENE-001","status":"RESEARCHED","formula_required":true,"priority":"C"},{"id":"INDUSTRY-SCROLL_PROGRESS-001","status":"SPECIFIED","formula_required":true,"priority":"C"},{"id":"INDUSTRY-HORIZONTAL_STORY-001","status":"RESEARCHED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-TEXT_SEQUENCE-001","status":"SPECIFIED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-IMAGE_SEQUENCE-001","status":"RESEARCHED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-SECTION_TRANSITION-001","status":"SPECIFIED","formula_required":false,"priority":"C"}]},{"family":"expressive","level":"COMPOSITION","industry_frequency":"COMMON","effects":[{"id":"INDUSTRY-HERO_ORCHESTRATION-001","status":"RESEARCHED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-LOGO_REVEAL-001","status":"SPECIFIED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-TYPOGRAPHIC_REVEAL-001","status":"RESEARCHED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-MARQUEE-001","status":"SPECIFIED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-GRADIENT_MOTION-001","status":"RESEARCHED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-AMBIENT_FLOAT-001","status":"SPECIFIED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-SIGNATURE_CURSOR-001","status":"RESEARCHED","formula_required":false,"priority":"C"},{"id":"INDUSTRY-PRODUCT_ASSEMBLY-001","status":"SPECIFIED","formula_required":false,"priority":"C"}]}];
    const grid=document.querySelector('#grid'),kindSelect=document.querySelector('#kind'),familySelect=document.querySelector('#family');
    for(const group of groups){
      familySelect.add(new Option(group.family,group.family));
      for(const effect of group.effects){
        const article=document.createElement('article');
        article.className='planned';
        article.dataset.kind='planned';
        article.dataset.family=group.family;
        article.innerHTML=`<h3>${effect.id.replace('INDUSTRY-','').replace('-001','').replaceAll('_',' ')}</h3><p>${group.family} · ${effect.status} · ${effect.formula_required?'formula':'no formula'}</p><span class="status">PLANNED_NOT_IMPLEMENTED</span>`;
        grid.append(article);
      }
    }
    function applyFilters(){
      document.querySelectorAll('article').forEach(article=>{
        article.hidden=(kindSelect.value!=='all'&&article.dataset.kind!==kindSelect.value)||(familySelect.value!=='all'&&article.dataset.family!==familySelect.value);
      });
    }
    kindSelect.onchange=familySelect.onchange=applyFilters;
    document.querySelectorAll('.implemented').forEach(card=>{
      const link=card.querySelector('.open-demo');
      card.addEventListener('click',event=>{
        if(event.target.closest('a'))return;
        link.click();
      });
      card.addEventListener('keydown',event=>{
        if(event.target.closest('a'))return;
        if(event.key==='Enter'||event.key===' '){
          event.preventDefault();
          link.click();
        }
      });
      link.addEventListener('click',event=>event.stopPropagation());
    });
  </script>
</body>
</html>
