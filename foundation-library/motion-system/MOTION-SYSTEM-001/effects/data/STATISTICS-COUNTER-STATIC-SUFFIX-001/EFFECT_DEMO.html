<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Statistics counter static suffix</title><style>body{font-family:system-ui;margin:0;display:grid;min-height:100vh;place-items:center;background:#f5f5f2;color:#172522}.card{padding:48px;border:1px solid #ccd6d2;border-radius:24px;background:#fff}.metric{display:inline-flex;align-items:baseline;font-size:64px;font-weight:700}.slot{display:inline-grid}.slot:before{content:"1000";visibility:hidden;grid-area:1/1}.number{grid-area:1/1;text-align:right;font-variant-numeric:tabular-nums}.suffix{flex:none}.controls{margin-top:24px}button{padding:10px 16px}</style><body><main class="card"><div class="metric" aria-label="More than 1000"><span class="slot" aria-hidden="true"><span class="number">0</span></span><span class="suffix" aria-hidden="true">+</span></div><div class="controls"><button id="replay">Replay</button></div></main><script>const n=document.querySelector('.number');const reduce=matchMedia('(prefers-reduced-motion: reduce)');function ease(t){return 1-Math.pow(1-t,3)}function run(){if(reduce.matches){n.textContent='1000';return}const start=performance.now(),duration=1600;function frame(now){const p=Math.min(1,Math.max(0,(now-start)/duration));n.textContent=String(Math.round(1000*ease(p)));if(p<1)requestAnimationFrame(frame);else n.textContent='1000'}requestAnimationFrame(frame)}document.fonts?.ready.then(run)??run();document.querySelector('#replay').addEventListener('click',()=>{n.textContent='0';run()});</script></body></html>
