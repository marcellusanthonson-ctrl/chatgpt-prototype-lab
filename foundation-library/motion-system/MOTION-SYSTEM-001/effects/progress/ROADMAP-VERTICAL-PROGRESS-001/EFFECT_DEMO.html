<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parametric roadmap</title><style>:root{--rail-start:0px;--rail-height:1px;--rail-fill-height:0px}body{font-family:system-ui;margin:0;background:#f4f3ef;color:#1c2926}.wrap{max-width:900px;margin:auto;padding:20vh 24px}.timeline{position:relative;padding-left:72px}.line,.fill{position:absolute;left:28px;top:var(--rail-start);width:3px;height:var(--rail-height);border-radius:3px}.line{background:#cbd6d2}.fill{height:var(--rail-fill-height);background:#0b7a70}.step{position:relative;min-height:260px}.dot{position:absolute;left:-53px;top:24px;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid #8da49e}.step.active .dot{background:#0b7a70;border-color:#0b7a70}.card{padding:28px;border-radius:20px;background:#fff;border:1px solid #d5dedb;opacity:calc(.45 + var(--progress,0)*.55);transform:translateY(calc((1 - var(--progress,0))*12px))}@media(prefers-reduced-motion:reduce){.card{transform:none}}</style><body><main class="wrap"><section class="timeline"><div class="line"></div><div class="fill"></div><article class="step"><span class="dot"></span><div class="card"><h2>Discovery</h2><p>Understand context and constraints.</p></div></article><article class="step"><span class="dot"></span><div class="card"><h2>Design</h2><p>Create and validate the direction with enough content to vary height.</p></div></article><article class="step"><span class="dot"></span><div class="card"><h2>Delivery</h2><p>Integrate, verify and preserve evidence.</p></div></article></section></main><script>const t=document.querySelector('.timeline'),steps=[...t.querySelectorAll('.step')],dots=steps.map(s=>s.querySelector('.dot')),fill=document.querySelector('.fill');const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);function center(el,tr){const r=el.getBoundingClientRect();return r.top+r.height/2-tr.top}function update(){const tr=t.getBoundingClientRect(),first=center(dots[0],tr),last=steps.at(-1).querySelector('.card').getBoundingClientRect(),lastTop=last.top-tr.top,lastMid=lastTop+last.height/2,target=lastMid+last.height,railStart=Math.max(0,first),railEnd=Math.min(t.scrollHeight,target),railHeight=Math.max(1,railEnd-railStart);t.style.setProperty('--rail-start',railStart.toFixed(2)+'px');t.style.setProperty('--rail-height',railHeight.toFixed(2)+'px');let fh=clamp(innerHeight*.64-tr.top-railStart,0,railHeight);if(matchMedia('(prefers-reduced-motion: reduce)').matches)fh=railHeight;t.style.setProperty('--rail-fill-height',fh.toFixed(2)+'px');steps.forEach((s,i)=>{const sr=s.getBoundingClientRect(),top=sr.top-tr.top-railStart,bottom=sr.bottom-tr.top-railStart,dist=Math.max(1,bottom-top),p=clamp((fh-top)/dist,0,1),dotOffset=center(dots[i],tr)-railStart;s.style.setProperty('--progress',p.toFixed(3));s.classList.toggle('active',fh>=dotOffset+3)})}let ticking=false;function req(){if(ticking)return;ticking=true;requestAnimationFrame(()=>{update();ticking=false})}addEventListener('scroll',req,{passive:true});addEventListener('resize',req);addEventListener('orientationchange',req);document.fonts?.ready.then(req);req();</script></body></html>
