name: Remove Motion Reconciliation Tooling
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-motion-system-167.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Remove temporary reconciliation files
        shell: bash
        run: |
          git config user.name "ChatGPT Prototype LAB"
          git config user.email "actions@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/reconcile-motion-system-167.yml \
            .github/workflows/reconcile-motion-system-167-pr.yml \
            scripts/reconcile_motion_system_167.py \
            projects/lab/test-executions/MOTION-SYSTEM-167-RECONCILIATION-TRIGGER.md
          git commit -m "chore(lab): remove temporary motion reconciliation tooling"
          git push origin HEAD:main
