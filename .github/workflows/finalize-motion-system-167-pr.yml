name: Finalize Motion System 167 PR
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply consumption transition and validate
        shell: bash
        run: |
          if ! test -f projects/lab/test-executions/MOTION-SYSTEM-167-FINALIZATION-DONE.json; then
            python - <<'PY'
          from pathlib import Path
          import json

          root = Path.cwd()
          def load(path): return json.loads((root/path).read_text(encoding='utf-8'))
          def save(path, data): (root/path).write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          def update_record(records, record):
              for index, item in enumerate(records):
                  if item.get('id') == record.get('id'):
                      records[index] = record
                      return
              records.append(record)

          amendment_path = Path('projects/lab/authorizations/AUTHORIZATION_LAB_TRANSVERSAL_MOTION_EFFECTS_LIBRARY_FOUNDATION_167_AMENDMENT_1_STAGE_2_PROGRESS.json')
          amendment = load(amendment_path)
          amendment['status'] = 'CONSUMED'
          amendment['stage_2']['status'] = 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION'
          amendment['validation']['general_repository_validator'] = 'EXACT_329_ZERO_ADDED_ZERO_REMOVED'
          amendment['validation']['canonical_aggregate_reconciliation'] = 'PASS'
          amendment['validation']['remote_publication_verification'] = 'PASS_REQUIRED_AT_MERGE_AND_VERIFIED_AFTER_MERGE'
          amendment['current_authority'] = {
              'commit_authorized': False,
              'push_authorized': False,
              'source_file_update_authorized': False,
              'scope': 'NONE_AFTER_CONSUMPTION',
              'runtime_authorized': False,
              'product_changes_authorized': False,
              'external_repository_mutation_authorized': False
          }
          amendment['consumption_state'] = 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION'
          amendment['authority_effect'] = 'NONE_AFTER_CONSUMPTION'
          save(amendment_path, amendment)

          current = load(Path('CURRENT_STATE.json'))
          current['authorization_state']['transversal_motion_effects_library_foundation_167'] = 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION'
          motion = current['canonical_model']['motion_system_foundation']
          motion['status'] = 'FOUNDATION_PUBLISHED_VALIDATION_PASS_INITIAL_EFFECTS_HUMAN_REVIEW_PENDING'
          motion['authorization_state'] = 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION'
          motion['validation'] = 'EXACT_329_ZERO_ADDED_ZERO_REMOVED_PROTECTED_BLOBS_PASS'
          current['canonical_model']['motion_system_foundation'] = motion
          save(Path('CURRENT_STATE.json'), current)

          expected = load(Path('tests/expected_repository_state.json'))
          expected['authorization_state'] = current['authorization_state']
          save(Path('tests/expected_repository_state.json'), expected)

          project = load(Path('projects/lab/PROJECT_STATE.json'))
          project['motion_system_foundation'] = motion
          save(Path('projects/lab/PROJECT_STATE.json'), project)

          continuity_path = Path('projects/lab/continuity/CURRENT_CONTINUITY.json')
          continuity = load(continuity_path)
          continuity['status'] = 'MOTION_SYSTEM_FOUNDATION_PUBLISHED_VALIDATION_PASS_INITIAL_EFFECTS_HUMAN_REVIEW_PENDING'
          continuity['authorization'] = {'167': 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION_NO_RESIDUAL_AUTHORITY'}
          continuity['authorizations'] = continuity['authorization']
          continuity['facts'] = [fact for fact in continuity['facts'] if 'remain pending' not in fact.get('claim','')]
          continuity['facts'].append({
              'claim': 'The canonical reconciliation passed at exactly 329 historical findings, zero added and zero removed; protected blobs remained unchanged.',
              'source_refs': [
                  'projects/lab/test-executions/MOTION-SYSTEM-167-RECONCILIATION-DONE.json',
                  'projects/lab/evidence/EVD-LAB-MOTION-SYSTEM-001.json'
              ]
          })
          for item in continuity['pending']:
              if item.get('id') == 'PEND-LAB-043':
                  item['status'] = 'PENDING_HUMAN_REVIEW_AND_STAGED_LIBRARY_POPULATION'
          continuity['single_next_action'] = 'JONATHAN_MARTINEZ_REVIEWS_THE_TWO_INITIAL_MOTION_EFFECT_DEMOS'
          continuity['first_phrase_for_new_conversation'] = 'Continúa ChatGPT Prototype LAB desde el HEAD remoto vigente de main. MOTION-SYSTEM-001 está publicado y validado; la autorización 167 está consumida y los dos efectos iniciales esperan revisión humana.'
          continuity['authority_effect'] = 'NONE_AFTER_AUTHORIZATION_167_CONSUMPTION'
          save(continuity_path, continuity)

          pending_path = Path('projects/lab/pending/PEND-LAB-043.json')
          pending = load(pending_path)
          pending['status'] = 'PENDING_HUMAN_REVIEW_AND_STAGED_LIBRARY_POPULATION'
          pending['current_authority'] = 'NONE_AFTER_AUTHORIZATION_167_CONSUMPTION'
          pending['required_actions'] = [
              'HUMAN_REVIEW_TWO_INITIAL_DEMOS',
              'PROMOTE_REVISE_OR_REJECT_EACH_INITIAL_EFFECT',
              'IMPLEMENT_INDUSTRY_EFFECTS_IN_BOUNDED_BATCHES',
              'AUTHORIZE_PROJECT_INTEGRATIONS_SEPARATELY'
          ]
          save(pending_path, pending)
          aggregate = load(Path('projects/lab/PENDING.json'))
          update_record(aggregate['records'], pending)
          save(Path('projects/lab/PENDING.json'), aggregate)

          roadmap = load(Path('projects/lab/ROADMAP.json'))
          for item in roadmap.get('records', []):
              if item.get('item') == 'TRANSVERSAL_MOTION_SYSTEM_FOUNDATION_167':
                  item['status'] = 'FOUNDATION_PUBLISHED_VALIDATION_PASS_INITIAL_EFFECTS_HUMAN_REVIEW_PENDING'
                  item['authority_effect'] = 'NONE_AFTER_AUTHORIZATION_167_CONSUMPTION'
          save(Path('projects/lab/ROADMAP.json'), roadmap)

          delta_path = Path('registry/deltas/transversal-motion-system-foundation-167.json')
          delta = load(delta_path)
          delta['authorization']['status'] = 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION'
          delta['active_authorization'] = None
          delta['stage_2'] = 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION'
          delta['validation']['general_repository_validator'] = 'EXACT_329_ZERO_ADDED_ZERO_REMOVED'
          delta['validation']['canonical_aggregate_reconciliation'] = 'PASS'
          delta['validation']['protected_blobs'] = 'PASS'
          delta['authority_effect'] = 'NONE_AFTER_CONSUMPTION'
          save(delta_path, delta)

          evidence_path = Path('projects/lab/evidence/EVD-LAB-MOTION-SYSTEM-001.json')
          evidence = load(evidence_path)
          evidence['classification'] = 'MOTION_SYSTEM_FOUNDATION_PUBLISHED_VALIDATION_PASS_INITIAL_EFFECTS_HUMAN_REVIEW_PENDING'
          evidence['verified_outputs']['general_repository_validator'] = 'EXACT_329_ZERO_ADDED_ZERO_REMOVED'
          evidence['verified_outputs']['canonical_aggregate_reconciliation'] = 'PASS'
          evidence['verified_outputs']['protected_blobs'] = 'PASS'
          evidence['limitations'] = [
              'FILE_PROTOCOL_NAVIGATION_BLOCKED_BY_ENVIRONMENT_ADMIN_POLICY_SET_CONTENT_BROWSER_VALIDATION_USED',
              'HUMAN_REVIEW_PENDING'
          ]
          evidence['result_boundary'] = 'FOUNDATION_PUBLISHED_NO_PRODUCT_OR_RUNTIME_EFFECT_INITIAL_EFFECTS_NOT_YET_REUSABLE_FOUNDATION'
          save(evidence_path, evidence)

          summary_path = Path('foundation-library/motion-system/MOTION-SYSTEM-001/evidence/VALIDATION_SUMMARY.json')
          summary = load(summary_path)
          summary['general_repository_validator'] = 'EXACT_329_ZERO_ADDED_ZERO_REMOVED'
          summary['canonical_aggregate_reconciliation'] = 'PASS'
          summary['protected_blobs'] = 'PASS'
          summary['result'] = 'FOUNDATION_PUBLISHED_VALIDATION_PASS_INITIAL_EFFECTS_HUMAN_REVIEW_PENDING'
          save(summary_path, summary)

          brief_path = Path('projects/lab/briefs/CODEX_TRANSVERSAL_MOTION_EFFECTS_LIBRARY_FOUNDATION_001_STAGE_2_STATUS.json')
          brief = load(brief_path)
          brief['execution_result'] = 'MOTION_SYSTEM_FOUNDATION_PUBLISHED_TWO_INITIAL_EFFECTS_HUMAN_REVIEW_PENDING'
          brief['consumption_state'] = 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION'
          save(brief_path, brief)

          prompt_path = root/'projects/lab/continuity/START_PROMPT.md'
          prompt_path.write_text('Continúa ChatGPT Prototype LAB desde el HEAD remoto vigente de main. MOTION-SYSTEM-001 está publicado y validado; la autorización 167 está consumida y los dos efectos iniciales esperan revisión humana.\n\nNo infieras autoridad: no existe permiso residual para modificar la biblioteca, promover efectos, integrar productos, ejecutar runtime o desplegar.\n', encoding='utf-8')

          continuity_md = root/'projects/lab/continuity/CURRENT_CONTINUITY.md'
          text = continuity_md.read_text(encoding='utf-8')
          text = text.replace('La autorización 167 permanece activa únicamente para ejecutar el validador general y reconciliar los agregados canónicos.', 'La autorización 167 está consumida tras validación exacta y publicación remota; los dos efectos iniciales permanecen pendientes de revisión humana.')
          continuity_md.write_text(text, encoding='utf-8')

          for path in ['CURRENT_STATE.md','projects/lab/PROJECT_STATE.md']:
              target = root/path
              text = target.read_text(encoding='utf-8')
              text = text.replace('La fundación está publicada y validada antes de publicación final; resta verificar el remoto y consumir la autorización.', 'La fundación está publicada y validada; la autorización 167 está consumida.')
              target.write_text(text, encoding='utf-8')
          PY
            cat > projects/lab/test-executions/MOTION-SYSTEM-167-FINALIZATION-DONE.json <<'JSON'
          {
            "schema_version": "1.0.0",
            "execution_id": "MOTION-SYSTEM-167-FINALIZATION-001",
            "authorization_id": "AUTHORIZATION_LAB_TRANSVERSAL_MOTION_EFFECTS_LIBRARY_FOUNDATION_167",
            "result": "CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION",
            "expected_general_validation": "EXACT_329_ZERO_ADDED_ZERO_REMOVED",
            "runtime_effect": "NONE",
            "product_effect": "NONE"
          }
          JSON
          fi
          python scripts/validate_motion_system_foundation.py
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root=Path.cwd()
          run=subprocess.run(['python','scripts/validate_repository.py'],text=True,capture_output=True)
          current=[]
          prefix=root.as_posix()+'/'
          for line in (run.stdout+'\n'+run.stderr).splitlines():
              if line.startswith('FAIL: '):
                  msg=line[6:].replace('\\','/')
                  if msg.startswith(prefix): msg=msg[len(prefix):]
                  current.append(msg)
          baseline=json.loads((root/'architecture/integrations/migration/M5/cutover-166/PRE_CUTOVER_GENERAL_VALIDATOR_BASELINE.json').read_text())
          previous=[item['normalized_message'] for item in baseline['findings']]
          added=[m for m in current if m not in set(previous)]
          removed=[m for m in previous if m not in set(current)]
          result={'current_count':len(current),'baseline_count':len(previous),'added_count':len(added),'removed_count':len(removed),'added':added,'removed':removed,'global_repository_pass':run.returncode==0}
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if len(current)!=329 or added or removed or run.returncode==0: sys.exit(1)
          PY
          python scripts/validate_repository_portable_baseline_165.py
          test "$(git rev-parse HEAD:project-sources/chatgpt/criterion-layer/CHATGPT-CRITERION-LAYER-001/MODULE_SELECTOR.json)" = "301ba432907758fc49a9b3c86a83fc762eac4607"
          test "$(git rev-parse HEAD:architecture/integrations/migration/M2/SHADOW_INTEGRATION_REGISTRY.json)" = "a067cd9f95b98aa1599d21e3a0ff35fa56ac3a78"
          test "$(git rev-parse HEAD:architecture/integrations/active/INTEGRATION_FACTORY_RESOLUTION_POINTER.json)" = "618c2fe00a6b23a84c5ce90361cb3b7cfa5b9053"
          if ! git diff --quiet; then
            git config user.name "ChatGPT Prototype LAB"
            git config user.email "actions@users.noreply.github.com"
            git add projects/lab/authorizations/AUTHORIZATION_LAB_TRANSVERSAL_MOTION_EFFECTS_LIBRARY_FOUNDATION_167_AMENDMENT_1_STAGE_2_PROGRESS.json CURRENT_STATE.json tests/expected_repository_state.json projects/lab/PROJECT_STATE.json projects/lab/continuity/CURRENT_CONTINUITY.json projects/lab/continuity/CURRENT_CONTINUITY.md projects/lab/continuity/START_PROMPT.md projects/lab/pending/PEND-LAB-043.json projects/lab/PENDING.json projects/lab/ROADMAP.json registry/deltas/transversal-motion-system-foundation-167.json projects/lab/evidence/EVD-LAB-MOTION-SYSTEM-001.json foundation-library/motion-system/MOTION-SYSTEM-001/evidence/VALIDATION_SUMMARY.json projects/lab/briefs/CODEX_TRANSVERSAL_MOTION_EFFECTS_LIBRARY_FOUNDATION_001_STAGE_2_STATUS.json CURRENT_STATE.md projects/lab/PROJECT_STATE.md projects/lab/test-executions/MOTION-SYSTEM-167-FINALIZATION-DONE.json
            git commit -m "docs(lab): consume motion system authorization 167"
            git push origin HEAD:${{ github.head_ref }}
          fi
