name: LAB governance sensor admin read bootstrap 209

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  admin-read:
    if: ${{ github.event.issue.pull_request != null && github.event.comment.body == '/lab-governance-admin-read-bootstrap-209' }}
    runs-on: ubuntu-latest
    environment: lab-governance-bootstrap
    timeout-minutes: 5

    steps:
      - name: Mint repo-scoped read-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.LAB_GOVERNANCE_READER_CLIENT_ID }}
          private-key: ${{ secrets.LAB_GOVERNANCE_READER_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: chatgpt-prototype-lab
          permission-administration: read

      - name: Query fixed governance surfaces and emit sanitized result
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REQUEST_REPOSITORY: ${{ github.repository }}
          REQUEST_REPOSITORY_ID: ${{ github.event.repository.id }}
          REQUEST_HEAD_SHA: ${{ github.sha }}
          REQUEST_COMMENT_ID: ${{ github.event.comment.id }}
          REQUEST_PR_NUMBER: ${{ github.event.issue.number }}
          REQUEST_RUN_ID: ${{ github.run_id }}
          REQUEST_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ["GH_APP_TOKEN"]
          repo = os.environ["REQUEST_REPOSITORY"]
          owner, name = repo.split("/", 1)
          api = "https://api.github.com"

          endpoints = {
              "installation_repositories": f"{api}/installation/repositories",
              "branch_protection": f"{api}/repos/{owner}/{name}/branches/main/protection",
              "actions_permissions": f"{api}/repos/{owner}/{name}/actions/permissions",
              "actions_workflow_permissions": f"{api}/repos/{owner}/{name}/actions/permissions/workflow",
              "actions_access": f"{api}/repos/{owner}/{name}/actions/permissions/access",
              "rulesets": f"{api}/repos/{owner}/{name}/rulesets?includes_parents=true",
              "branch_rules": f"{api}/repos/{owner}/{name}/rules/branches/main",
          }

          def request_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "lab-governance-reader-bootstrap-209",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      raw = response.read().decode("utf-8")
                      return response.status, json.loads(raw) if raw else None, None
              except urllib.error.HTTPError as exc:
                  try:
                      body = json.loads(exc.read().decode("utf-8"))
                      message = body.get("message") if isinstance(body, dict) else None
                  except Exception:
                      message = None
                  return exc.code, None, message

          def compact(name, status, data, message):
              out = {"http": status}
              if message:
                  out["message"] = message
              if data is None:
                  return out

              if name == "installation_repositories":
                  repos = data.get("repositories", []) if isinstance(data, dict) else []
                  out["total_count"] = data.get("total_count") if isinstance(data, dict) else None
                  out["repositories"] = [r.get("full_name") for r in repos if isinstance(r, dict)]
              elif name == "branch_protection" and isinstance(data, dict):
                  out["required_status_checks_present"] = data.get("required_status_checks") is not None
                  out["required_pull_request_reviews_present"] = data.get("required_pull_request_reviews") is not None
                  out["restrictions_present"] = data.get("restrictions") is not None
                  for key in ["enforce_admins", "allow_force_pushes", "allow_deletions", "required_conversation_resolution", "lock_branch", "allow_fork_syncing"]:
                      value = data.get(key)
                      if isinstance(value, dict) and "enabled" in value:
                          out[key] = value.get("enabled")
              elif name == "actions_permissions" and isinstance(data, dict):
                  for key in ["enabled", "allowed_actions", "sha_pinning_required"]:
                      if key in data:
                          out[key] = data.get(key)
              elif name == "actions_workflow_permissions" and isinstance(data, dict):
                  for key in ["default_workflow_permissions", "can_approve_pull_request_reviews"]:
                      if key in data:
                          out[key] = data.get(key)
              elif name == "actions_access" and isinstance(data, dict):
                  for key in ["access_level"]:
                      if key in data:
                          out[key] = data.get(key)
              elif name == "rulesets" and isinstance(data, list):
                  out["count"] = len(data)
                  out["rulesets"] = [
                      {k: item.get(k) for k in ["id", "name", "target", "enforcement", "source_type"] if k in item}
                      for item in data if isinstance(item, dict)
                  ]
              elif name == "branch_rules" and isinstance(data, list):
                  out["count"] = len(data)
                  out["rule_types"] = [item.get("type") for item in data if isinstance(item, dict) and item.get("type")]
              return out

          results = {}
          for endpoint_name, endpoint_url in endpoints.items():
              status, data, message = request_json(endpoint_url)
              results[endpoint_name] = compact(endpoint_name, status, data, message)

          result = {
              "schema_version": "1.0.0",
              "authorization_id": "AUTHORIZATION_LAB_PLUS_COMPATIBLE_GITHUB_GOVERNANCE_SENSOR_ADMIN_READ_BOOTSTRAP_209",
              "request_id": f"LAB-GOV-209-{os.environ['REQUEST_COMMENT_ID']}",
              "repository": repo,
              "repository_id": int(os.environ["REQUEST_REPOSITORY_ID"]),
              "target_head": os.environ["REQUEST_HEAD_SHA"],
              "comment_id": int(os.environ["REQUEST_COMMENT_ID"]),
              "pr_number": int(os.environ["REQUEST_PR_NUMBER"]),
              "run_id": int(os.environ["REQUEST_RUN_ID"]),
              "run_attempt": int(os.environ["REQUEST_RUN_ATTEMPT"]),
              "app_slug": os.environ.get("APP_SLUG") or None,
              "installation_id": int(os.environ["INSTALLATION_ID"]) if os.environ.get("INSTALLATION_ID") else None,
              "results": results,
          }

          print("LAB_GOVERNANCE_209_RESULT_JSON=" + json.dumps(result, sort_keys=True, separators=(",", ":")))
          PY
