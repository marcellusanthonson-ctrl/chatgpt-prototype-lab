name: Validate Motion System 167
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Motion system validator
        run: python scripts/validate_motion_system_foundation.py
      - name: Repository validator exact delta
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          root = Path.cwd()
          run = subprocess.run(['python','scripts/validate_repository.py'], text=True, capture_output=True)
          print(run.stdout, end='')
          print(run.stderr, end='')
          current=[]
          for line in (run.stdout + '\n' + run.stderr).splitlines():
              if line.startswith('FAIL: '):
                  msg=line[6:].replace('\\','/')
                  prefix=root.as_posix()+'/'
                  if msg.startswith(prefix): msg=msg[len(prefix):]
                  current.append(msg)
          baseline=json.loads((root/'architecture/integrations/migration/M5/cutover-166/PRE_CUTOVER_GENERAL_VALIDATOR_BASELINE.json').read_text())
          previous=[item['normalized_message'] for item in baseline['findings']]
          added=[m for m in current if m not in set(previous)]
          removed=[m for m in previous if m not in set(current)]
          result={
            'current_count':len(current),
            'baseline_count':len(previous),
            'added_count':len(added),
            'removed_count':len(removed),
            'added':added,
            'removed':removed,
            'global_repository_pass':run.returncode==0
          }
          print('VALIDATOR_DELTA_JSON='+json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
      - name: Portable baseline validator
        run: python scripts/validate_repository_portable_baseline_165.py
      - name: Protected blob verification
        shell: bash
        run: |
          test "$(git rev-parse HEAD:project-sources/chatgpt/criterion-layer/CHATGPT-CRITERION-LAYER-001/MODULE_SELECTOR.json)" = "301ba432907758fc49a9b3c86a83fc762eac4607"
          test "$(git rev-parse HEAD:architecture/integrations/migration/M2/SHADOW_INTEGRATION_REGISTRY.json)" = "a067cd9f95b98aa1599d21e3a0ff35fa56ac3a78"
          test "$(git rev-parse HEAD:architecture/integrations/active/INTEGRATION_FACTORY_RESOLUTION_POINTER.json)" = "618c2fe00a6b23a84c5ce90361cb3b7cfa5b9053"
          echo PROTECTED_BLOBS_PASS
