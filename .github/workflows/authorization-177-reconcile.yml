name: Authorization 177 exact reconciliation

on:
  push:
    branches:
      - automation/authorization-177-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: automation/authorization-177-reconcile
          fetch-depth: 0

      - name: Apply and validate exact payload
        shell: bash
        run: |
          set -euo pipefail

          cat .reconcile177/payload.part{01..11}.b64 > /tmp/authorization-177-payload.b64
          base64 --decode /tmp/authorization-177-payload.b64 > /tmp/authorization-177-payload.tar.gz
          echo "845c28c8e09a8c8babb5e6f4c59c5ae01dc1b200fa440c9911a29c072594ebcf  /tmp/authorization-177-payload.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/authorization-177-payload.tar.gz -C .

          test "$(git hash-object CURRENT_STATE.json)" = "ab95d10f82f12a441a3e2bef25d1b1dec56d081b"
          test "$(git hash-object projects/lab/PENDING.json)" = "0cccec8101d61cd188d52f3e313811f9cc44a2f5"
          test "$(git hash-object registry/index.json)" = "4d9b247a91f8de2755a7c3268995fd06ff121f6a"

          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          json_paths = [
              Path('CURRENT_STATE.json'),
              Path('projects/lab/PENDING.json'),
              Path('registry/index.json'),
              Path('projects/lab/authorizations/AUTHORIZATION_LAB_PEND_047_EXACT_CANONICAL_AGGREGATE_RECONCILIATION_AND_CLOSURE_177.json'),
              Path('projects/lab/briefs/CODEX_PEND_047_EXACT_CANONICAL_AGGREGATE_RECONCILIATION_177_001.json'),
              Path('projects/lab/evidence/EVD-LAB-PEND-047-EXACT-CANONICAL-AGGREGATE-RECONCILIATION-177.json'),
              Path('registry/deltas/pend-lab-047-exact-canonical-aggregate-reconciliation-177.json'),
              Path('projects/lab/pending/PEND-LAB-043.json'),
              Path('projects/lab/pending/PEND-LAB-047.json'),
              Path('projects/lab/continuity/CURRENT_CONTINUITY.json'),
              Path('projects/lab/continuity/ATTACHMENT_MANIFEST.json'),
          ]
          parsed = {str(path): json.loads(path.read_text(encoding='utf-8')) for path in json_paths}

          state = parsed['CURRENT_STATE.json']
          pending = parsed['projects/lab/PENDING.json']
          index = parsed['registry/index.json']
          auth = parsed['projects/lab/authorizations/AUTHORIZATION_LAB_PEND_047_EXACT_CANONICAL_AGGREGATE_RECONCILIATION_AND_CLOSURE_177.json']
          brief = parsed['projects/lab/briefs/CODEX_PEND_047_EXACT_CANONICAL_AGGREGATE_RECONCILIATION_177_001.json']
          evidence = parsed['projects/lab/evidence/EVD-LAB-PEND-047-EXACT-CANONICAL-AGGREGATE-RECONCILIATION-177.json']
          delta = parsed['registry/deltas/pend-lab-047-exact-canonical-aggregate-reconciliation-177.json']

          assert state['status'] == 'PRIORITY_INTEGRATIONS_PHASE_1_CONTRACT_COMPLETE_TESTS_NOT_AUTHORIZED'
          assert state['current_phase'] == 'PRIORITY_INTEGRATIONS_PHASE_1_CONTRACT_COMPLETE_TESTS_NOT_AUTHORIZED'
          assert state['open_errors'] == []
          assert state['next_authorized_action'] == 'NONE_AFTER_AUTHORIZATION_177_CONSUMPTION'
          assert state['next_recommended_transition'] == 'HUMAN_REVIEW_STATISTICS_COUNTER_STATIC_SUFFIX_001'
          assert state['authorization_state']['roadmap_canonical_reference_and_behavior_core_extraction_176'] == 'CONSUMED_BLOCKED_BY_UNRESOLVED_CANONICAL_STATE_CONTRADICTION'
          assert state['authorization_state']['pend_047_exact_canonical_aggregate_reconciliation_and_closure_177'] == 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION'
          assert state['motion_system_reconciliation_177']['pend_lab_047'] == 'CLOSED_CANONICAL_AGGREGATES_RECONCILED_AND_VALIDATED'
          assert state['motion_system_reconciliation_177']['active_execution_authority'] == 'NONE'

          records = pending['records']
          ids = [record['id'] for record in records]
          assert len(ids) == len(set(ids)), 'duplicate pending IDs'
          statuses = {record['id']: record['status'] for record in records}
          assert statuses['PEND-LAB-043'] == 'ROADMAP_CANONICAL_REFERENCE_AND_BEHAVIOR_CORE_COMPLETE_REMAINING_MOTION_LIBRARY_GATES_PENDING'
          assert statuses['PEND-LAB-046'] == 'CLOSED_BY_APPROVED_SOURCE_FIDELITY'
          assert statuses['PEND-LAB-047'] == 'CLOSED_CANONICAL_AGGREGATES_RECONCILED_AND_VALIDATED'

          assert index['counts']['authorizations'] == 101
          assert index['counts']['evidence'] == 83
          for key, value in index['registries'].items():
              if isinstance(value, list):
                  assert len(value) == len(set(value)), f'duplicate index paths in {key}'

          new_paths = [
              'projects/lab/authorizations/AUTHORIZATION_LAB_ROADMAP_CANONICAL_REFERENCE_AND_BEHAVIOR_CORE_EXTRACTION_176.json',
              'projects/lab/authorizations/AUTHORIZATION_LAB_PEND_047_EXACT_CANONICAL_AGGREGATE_RECONCILIATION_AND_CLOSURE_177.json',
              'projects/lab/evidence/EVD-LAB-ROADMAP-CANONICAL-REFERENCE-BEHAVIOR-CORE-176.json',
              'projects/lab/evidence/EVD-LAB-PEND-047-EXACT-CANONICAL-AGGREGATE-RECONCILIATION-177.json',
              'registry/deltas/roadmap-canonical-reference-behavior-core-176.json',
              'registry/deltas/pend-lab-047-exact-canonical-aggregate-reconciliation-177.json',
              'projects/lab/pending/PEND-LAB-047.json',
              'foundation-library/motion-system/MOTION-SYSTEM-001/effects/progress/ROADMAP-VERTICAL-PROGRESS-001/CANONICAL_REFERENCE.json',
              'foundation-library/motion-system/MOTION-SYSTEM-001/effects/progress/ROADMAP-VERTICAL-PROGRESS-001/behavior-core/BEHAVIOR_CORE_CONTRACT.json',
          ]
          for path in new_paths:
              assert (root / path).exists(), f'missing indexed path: {path}'

          delta_path = 'registry/deltas/pend-lab-047-exact-canonical-aggregate-reconciliation-177.json'
          for category in ('authorization_deltas', 'evidence_deltas', 'current_state_deltas', 'error_deltas', 'foundation_library_deltas'):
              assert delta_path in index['registries'][category]

          assert auth['status'] == 'CONSUMED_ON_VERIFIED_REMOTE_PUBLICATION'
          assert auth['residual_authority'] is False
          assert brief['status'] == 'COMPLETED_PASS'
          assert evidence['status'] == 'PASS_EXACT_CANONICAL_AGGREGATES_RECONCILED_PEND_LAB_047_CLOSED'
          assert delta['status'] == 'PASS_CANONICAL_AGGREGATES_RECONCILED_PEND_LAB_047_CLOSED'
          PY

          rm -rf .reconcile177
          rm -f .github/workflows/authorization-177-reconcile.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "Authorization 177 bounded executor"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "apply exact canonical aggregate reconciliation 177"
          git push origin HEAD:automation/authorization-177-reconcile
