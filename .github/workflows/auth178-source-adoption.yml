name: auth178-source-adoption
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.head_ref == 'auth178-statistics-source-adoption'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and materialize source-package evidence
        run: |
          set -euo pipefail
          BASE='foundation-library/motion-system/MOTION-SYSTEM-001/source-packages/CAROLINA-STATISTICS-MOTION-EXPERIMENT-001'
          cat > /tmp/auth178-payload.sha256 <<'EOF'
          f6466958dcbba9a720db314a20128b8dc64badeb474456c99987db5fc7801006  .auth178-payload/ARCHIVE_CONTENT_INDEX.json.xz
          039abbf3569c7f0f778e9a75ff73f3797d2dafa6650df9b7f9df49b2bfa45d7f  .auth178-payload/key-artifacts.tar.xz
          07f6733aefa156a11b9f21cb8a08d4372c7ed53b6911311cb95e871798f3c2e8  .auth178-payload/auth178_reconcile.py.xz
          EOF
          sha256sum -c /tmp/auth178-payload.sha256
          xz -t .auth178-payload/ARCHIVE_INTEGRITY_ATTEMPT_007.json.xz
          mkdir -p "$BASE/expanded/statistics-motion-001/evidence" scripts
          xz -dc .auth178-payload/ARCHIVE_CONTENT_INDEX.json.xz > "$BASE/ARCHIVE_CONTENT_INDEX.json"
          xz -dc .auth178-payload/ARCHIVE_INTEGRITY_ATTEMPT_007.json.xz > "$BASE/expanded/statistics-motion-001/evidence/ARCHIVE_INTEGRITY_ATTEMPT_007.json"
          tar -xJf .auth178-payload/key-artifacts.tar.xz -C .
          xz -dc .auth178-payload/auth178_reconcile.py.xz > scripts/_auth178_reconcile.py
      - name: Reconcile Stage 1
        run: python scripts/_auth178_reconcile.py
      - name: Validate clean governed result
        run: |
          set -euo pipefail
          test ! -e .auth178-payload
          test ! -e scripts/_auth178_reconcile.py
          test ! -e .github/workflows/auth178-source-adoption.yml
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          forbidden = ['carolina-md-next-landing', 'carolina-md-experiments']
          changed = set()
          for command in [
              ['git','diff','--name-only','origin/main'],
              ['git','ls-files','--others','--exclude-standard'],
          ]:
              output = subprocess.check_output(command, text=True)
              changed.update(line.strip() for line in output.splitlines() if line.strip())
          for path in changed:
              if any(token in path for token in forbidden):
                  raise SystemExit(f'FORBIDDEN_PATH_CHANGE {path}')
          print('AUTH178_JSON_AND_SCOPE_PASS')
          PY
      - name: Commit reconciled Stage 1
        run: |
          set -euo pipefail
          git config user.name 'chatgpt-prototype-lab-bot'
          git config user.email 'chatgpt-prototype-lab-bot@users.noreply.github.com'
          git add -A
          git commit -m 'complete statistics counter functional source adoption 178'
          git push origin HEAD:${{ github.head_ref }}
