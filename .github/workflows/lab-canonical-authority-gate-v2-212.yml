name: LAB Canonical Authority Gate v2

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - lab-governance-canary-210

permissions:
  contents: read
  pull-requests: read

jobs:
  canonical-authority-gate:
    name: LAB Canonical Authority Gate v2
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate canonical authority and governed content
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          api = "https://api.github.com"
          canonical_ref = "main"
          required_approver = "Jonathan Martínez"
          expected_action = "PULL_REQUEST_PUBLICATION_TO_CANARY"

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as handle:
              event = json.load(handle)

          pr = event.get("pull_request") or {}
          pr_number = pr.get("number")
          body = pr.get("body") or ""
          head = pr.get("head") or {}
          base = pr.get("base") or {}
          head_repo = (head.get("repo") or {}).get("full_name")
          head_sha = head.get("sha")
          base_ref = base.get("ref")
          failures = []

          if not pr_number or not head_sha or not base_ref:
              failures.append("PR_METADATA_MISSING")
          if head_repo != repo:
              failures.append("SAME_REPOSITORY_PR_REQUIRED")

          authorization_pattern = re.compile(
              r"(?mi)^Authorization:\s*(AUTHORIZATION_[A-Z0-9][A-Z0-9_.-]{2,})\s*$"
          )
          match = authorization_pattern.search(body)
          authorization_id = match.group(1) if match else None
          if not authorization_id:
              failures.append("AUTHORIZATION_TRAILER_MISSING_OR_INVALID")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "lab-canonical-authority-gate-v2-212",
          }

          def api_json(url):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  payload = None
                  try:
                      payload = json.loads(exc.read().decode("utf-8"))
                  except Exception:
                      pass
                  return exc.code, payload

          def canonical_file(path):
              encoded = urllib.parse.quote(path, safe="/")
              status, payload = api_json(
                  f"{api}/repos/{repo}/contents/{encoded}?ref={canonical_ref}"
              )
              if status != 200 or not isinstance(payload, dict):
                  return status, None
              if payload.get("encoding") != "base64":
                  return status, None
              try:
                  raw = base64.b64decode((payload.get("content") or "").encode("ascii"))
                  return status, raw.decode("utf-8")
              except Exception:
                  return status, None

          def normalize_repository_scope(authorization):
              raw = authorization.get("repository")
              if isinstance(raw, dict):
                  return raw.get("name"), raw.get("expected_parent_head")
              if isinstance(raw, str):
                  return raw, authorization.get("expected_parent_head")
              return None, authorization.get("expected_parent_head")

          authorization = None
          lifecycle = None
          authorization_path = None
          lifecycle_path = None
          normalized_repository_name = None
          normalized_baseline = None

          if authorization_id:
              authorization_path = f"projects/lab/authorizations/{authorization_id}.json"
              status, text = canonical_file(authorization_path)
              if status != 200 or text is None:
                  failures.append("AUTHORIZATION_ARTIFACT_NOT_FOUND")
              else:
                  try:
                      authorization = json.loads(text)
                  except json.JSONDecodeError:
                      failures.append("AUTHORIZATION_ARTIFACT_INVALID_JSON")

          if isinstance(authorization, dict):
              if authorization.get("authorization_id") != authorization_id:
                  failures.append("AUTHORIZATION_ID_MISMATCH")
              if authorization.get("status") != "GRANTED":
                  failures.append("AUTHORIZATION_NOT_EFFECTIVELY_GRANTED")
              if authorization.get("approved_by") != required_approver:
                  failures.append("AUTHORIZATION_APPROVER_INVALID")
              if authorization.get("grant_inferred") is not False:
                  failures.append("AUTHORIZATION_GRANT_INFERRED_OR_UNKNOWN")

              approval_source = authorization.get("approval_source_ref")
              if not isinstance(approval_source, str) or not approval_source:
                  failures.append("AUTHORIZATION_APPROVAL_SOURCE_MISSING")
              else:
                  approval_status, approval_text = canonical_file(approval_source)
                  if approval_status != 200 or approval_text is None:
                      failures.append("AUTHORIZATION_APPROVAL_SOURCE_NOT_FOUND")

              normalized_repository_name, normalized_baseline = normalize_repository_scope(authorization)
              if normalized_repository_name != repo:
                  failures.append("AUTHORIZATION_REPOSITORY_SCOPE_MISMATCH")

              lifecycle_path = authorization.get("lifecycle_ref")
              if not isinstance(lifecycle_path, str) or not lifecycle_path:
                  failures.append("AUTHORIZATION_LIFECYCLE_REF_MISSING")
              else:
                  lifecycle_status, lifecycle_text = canonical_file(lifecycle_path)
                  if lifecycle_status != 200 or lifecycle_text is None:
                      failures.append("AUTHORIZATION_LIFECYCLE_NOT_FOUND")
                  else:
                      try:
                          lifecycle = json.loads(lifecycle_text)
                      except json.JSONDecodeError:
                          failures.append("AUTHORIZATION_LIFECYCLE_INVALID_JSON")

              authority = authorization.get("authority") or {}
              if not isinstance(authority, dict):
                  authority = {}
              for field in (
                  "canonical_authority_gate_v2_canary_implementation",
                  "canary_pull_request_creation_update_and_merge",
                  "canary_test_authorized",
              ):
                  if authority.get(field) is not True:
                      failures.append(f"AUTHORIZATION_ACTION_SCOPE_DENIED:{field}")

              clarification = authorization.get("scope_clarification_no_authority_expansion") or {}
              if not isinstance(clarification, dict):
                  clarification = {}
              if clarification.get("adds_authority") is not False:
                  failures.append("AUTHORIZATION_SCOPE_CLARIFICATION_INVALID")
              scope = clarification.get("publication_enforcement_scope") or {}
              if not isinstance(scope, dict):
                  scope = {}
              if scope.get("repository") != repo:
                  failures.append("AUTHORIZATION_PUBLICATION_REPOSITORY_SCOPE_MISMATCH")
              allowed_bases = scope.get("allowed_base_branches") or []
              if base_ref not in allowed_bases:
                  failures.append("AUTHORIZATION_BRANCH_SCOPE_MISMATCH")
              allowed_actions = scope.get("allowed_actions") or []
              if expected_action not in allowed_actions:
                  failures.append("AUTHORIZATION_ACTION_SCOPE_MISMATCH")
              if scope.get("same_repository_head_required") is not True:
                  failures.append("AUTHORIZATION_SAME_REPOSITORY_REQUIREMENT_MISSING")

              baseline = normalized_baseline
              if not isinstance(baseline, str) or not re.fullmatch(r"[0-9a-f]{40}", baseline):
                  failures.append("AUTHORIZATION_BASELINE_MISSING_OR_INVALID")
              else:
                  compare_status, compare = api_json(
                      f"{api}/repos/{repo}/compare/{baseline}...{canonical_ref}"
                  )
                  if compare_status != 200 or not isinstance(compare, dict):
                      failures.append("AUTHORIZATION_BASELINE_NOT_VERIFIABLE")
                  else:
                      relation = compare.get("status")
                      merge_base = (compare.get("merge_base_commit") or {}).get("sha")
                      if relation not in ("ahead", "identical") or merge_base != baseline:
                          failures.append("AUTHORIZATION_BASELINE_NOT_ANCESTOR_OF_MAIN")

          if isinstance(lifecycle, dict):
              if lifecycle.get("authorization") != authorization_id:
                  failures.append("AUTHORIZATION_LIFECYCLE_ID_MISMATCH")
              lifecycle_status = str(lifecycle.get("status") or "").upper()
              terminal_markers = ("CONSUMED", "REVOKED", "EXPIRED", "REJECTED", "NOT_ACTIVE")
              if not lifecycle_status.startswith("GRANTED_STAGE_1_ACTIVE"):
                  failures.append("AUTHORIZATION_LIFECYCLE_NOT_ACTIVE")
              if any(marker in lifecycle_status for marker in terminal_markers):
                  failures.append("AUTHORIZATION_LIFECYCLE_TERMINAL_OR_INACTIVE")
              residual = str(lifecycle.get("residual_authority") or "").upper()
              if not residual or residual.startswith("NONE"):
                  failures.append("AUTHORIZATION_RESIDUAL_AUTHORITY_NONE_OR_UNKNOWN")

          changed = []
          if pr_number:
              page = 1
              while True:
                  status, items = api_json(
                      f"{api}/repos/{repo}/pulls/{pr_number}/files?per_page=100&page={page}"
                  )
                  if status != 200 or not isinstance(items, list):
                      failures.append("PR_CHANGED_FILES_UNAVAILABLE")
                      break
                  changed.extend(items)
                  if len(items) < 100:
                      break
                  page += 1

          scope = {}
          if isinstance(authorization, dict):
              clarification = authorization.get("scope_clarification_no_authority_expansion") or {}
              if isinstance(clarification, dict):
                  candidate_scope = clarification.get("publication_enforcement_scope") or {}
                  if isinstance(candidate_scope, dict):
                      scope = candidate_scope
          prefixes = scope.get("allowed_path_prefixes") or []
          if not prefixes:
              failures.append("AUTHORIZATION_PATH_SCOPE_MISSING")
          for item in changed:
              filename = item.get("filename") or ""
              if not any(filename.startswith(prefix) for prefix in prefixes):
                  failures.append(f"AUTHORIZATION_PATH_SCOPE_MISMATCH:{filename}")

          class DuplicateKeyError(ValueError):
              pass

          def reject_duplicates(pairs):
              output = {}
              for key, value in pairs:
                  if key in output:
                      raise DuplicateKeyError(key)
                  output[key] = value
              return output

          def has_conflict_markers(text):
              lines = text.splitlines()
              left = [i for i, line in enumerate(lines) if line.startswith("<<<<<<<")]
              mid = [i for i, line in enumerate(lines) if line == "======="]
              right = [i for i, line in enumerate(lines) if line.startswith(">>>>>>>")]
              return any(a < b < c for a in left for b in mid for c in right)

          json_checked = 0
          text_checked = 0
          for item in changed:
              status = item.get("status")
              filename = item.get("filename") or ""
              blob_sha = item.get("sha")
              if status == "removed" or not blob_sha:
                  continue
              blob_status, blob = api_json(f"{api}/repos/{repo}/git/blobs/{blob_sha}")
              if blob_status != 200 or not isinstance(blob, dict):
                  failures.append(f"BLOB_UNAVAILABLE:{filename}")
                  continue
              if blob.get("encoding") != "base64":
                  failures.append(f"UNSUPPORTED_BLOB_ENCODING:{filename}")
                  continue
              raw = base64.b64decode((blob.get("content") or "").encode("ascii"))
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  continue
              text_checked += 1
              if has_conflict_markers(text):
                  failures.append(f"MERGE_CONFLICT_MARKERS:{filename}")
              if filename.lower().endswith(".json"):
                  json_checked += 1
                  try:
                      json.loads(text, object_pairs_hook=reject_duplicates)
                  except DuplicateKeyError as exc:
                      failures.append(f"DUPLICATE_JSON_KEY:{filename}:{exc}")
                  except json.JSONDecodeError as exc:
                      failures.append(
                          f"INVALID_JSON:{filename}:line={exc.lineno}:column={exc.colno}"
                      )

          result = {
              "authorization": authorization_id,
              "authorization_path": authorization_path,
              "base_ref": base_ref,
              "canonical_ref": canonical_ref,
              "changed_files": len(changed),
              "head_sha": head_sha,
              "json_files_checked": json_checked,
              "lifecycle_path": lifecycle_path,
              "normalized_repository_name": normalized_repository_name,
              "pr_number": pr_number,
              "same_repository_pr": head_repo == repo,
              "text_files_checked": text_checked,
              "failures": sorted(set(failures)),
          }
          print("LAB_CANONICAL_AUTHORITY_GATE_V2_RESULT=" + json.dumps(result, sort_keys=True))
          if failures:
              sys.exit(1)
          PY
