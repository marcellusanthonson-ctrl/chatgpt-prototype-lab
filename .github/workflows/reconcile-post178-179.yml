name: Reconcile post-178 canonical state 179

on:
  push:
    branches:
      - post178-canonical-reconciliation-179
    paths:
      - scripts/reconcile_post178_canonical_state_179.py
      - .github/workflows/reconcile-post178-179.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: post178-canonical-reconciliation-179
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply bounded reconciliation
        run: python scripts/reconcile_post178_canonical_state_179.py apply
      - name: Revalidate deterministic result
        run: python scripts/reconcile_post178_canonical_state_179.py check
      - name: Remove transient execution files
        run: |
          rm scripts/reconcile_post178_canonical_state_179.py
          rm .github/workflows/reconcile-post178-179.yml
      - name: Stage and verify final allowed diff
        run: |
          git add -A
          python - <<'PY'
          import subprocess
          allowed = {
            'CURRENT_STATE.json',
            'projects/lab/PROJECT_STATE.json',
            'projects/lab/PENDING.json',
            'projects/lab/ROADMAP.json',
            'projects/lab/evidence/EVD-LAB-PRIORITY-INTEGRATIONS-PHASE-1-170.json',
            'projects/lab/continuity/CURRENT_CONTINUITY.json',
            'projects/lab/continuity/CURRENT_CONTINUITY.md',
            'projects/lab/continuity/START_PROMPT.md',
            'projects/lab/continuity/ATTACHMENT_MANIFEST.json',
            'registry/index.json',
            'projects/lab/authorizations/AUTHORIZATION_LAB_POST_178_CANONICAL_STATE_AND_PHASE1_EVIDENCE_RECONCILIATION_179.json',
            'projects/lab/briefs/CODEX_POST_178_CANONICAL_STATE_AND_PHASE1_EVIDENCE_RECONCILIATION_179_001.json',
            'projects/lab/evidence/EVD-LAB-POST-178-CANONICAL-STATE-RECONCILIATION-179.json',
            'registry/deltas/post-178-canonical-state-phase1-evidence-reconciliation-179.json',
          }
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only','origin/main'], text=True).splitlines())
          extra = changed - allowed
          missing = allowed - changed
          if extra or missing:
              raise SystemExit(f'extra={sorted(extra)} missing={sorted(missing)}')
          print(f'PASS: {len(changed)} authorized files')
          PY
      - name: Commit validated reconciliation
        run: |
          git commit -m "docs(lab): reconcile post-178 canonical state 179"
          git push origin HEAD:post178-canonical-reconciliation-179
