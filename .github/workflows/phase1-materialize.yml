name: Phase 1 contract materialization
on:
  push:
    branches:
      - phase1-priority-integrations-170-r2

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-priority-integrations-170-r2
          fetch-depth: 0
      - name: Reconstruct transient generator
        run: cat scripts/.phase1_generator_parts/part-* > scripts/phase1_generator_temp.py
      - name: Materialize authorized Phase 1 files
        run: python scripts/phase1_generator_temp.py --materialize
      - name: Install validation-only dependency
        run: python -m pip install --disable-pip-version-check --requirement scripts/requirements-integration-factory-validation.txt
      - name: Validate complete repository contracts
        run: python scripts/validate_priority_integrations_phase1_contracts_170.py > /tmp/phase1-validation.json
      - name: Finalize evidence from validator result
        run: python scripts/phase1_generator_temp.py --finalize /tmp/phase1-validation.json
      - name: Remove transient automation
        run: |
          git rm .github/workflows/phase1-materialize.yml
          rm scripts/phase1_generator_temp.py
          git rm -r scripts/.phase1_generator_parts
          git rm -r .phase1_payload
      - name: Commit validated Phase 1 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(lab): complete priority integration factory contracts"
          git push origin HEAD:phase1-priority-integrations-170-r2
