name: LAB Publication Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - main
      - lab-governance-canary-210

permissions:
  contents: read
  pull-requests: read

jobs:
  publication-gate:
    name: LAB Publication Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate governed publication metadata and changed content
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          event_path = os.environ["GITHUB_EVENT_PATH"]
          api = "https://api.github.com"

          with open(event_path, "r", encoding="utf-8") as handle:
              event = json.load(handle)

          pr = event.get("pull_request") or {}
          pr_number = pr.get("number")
          body = pr.get("body") or ""
          head_repo = ((pr.get("head") or {}).get("repo") or {}).get("full_name")
          head_sha = (pr.get("head") or {}).get("sha")

          failures = []

          if not pr_number or not head_sha:
              failures.append("PR_METADATA_MISSING")

          if head_repo != repo:
              failures.append("SAME_REPOSITORY_PR_REQUIRED_FOR_A1_GATE")

          authorization_pattern = re.compile(
              r"(?mi)^Authorization:\s*(AUTHORIZATION_[A-Z0-9][A-Z0-9_.-]{2,})\s*$"
          )
          authorization_match = authorization_pattern.search(body)
          if not authorization_match:
              failures.append("AUTHORIZATION_TRAILER_MISSING_OR_INVALID")

          def api_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "lab-publication-gate-210",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.loads(response.read().decode("utf-8"))

          changed = []
          page = 1
          while True:
              items = api_json(
                  f"{api}/repos/{repo}/pulls/{pr_number}/files?per_page=100&page={page}"
              )
              changed.extend(items)
              if len(items) < 100:
                  break
              page += 1

          class DuplicateKeyError(ValueError):
              pass

          def reject_duplicates(pairs):
              output = {}
              for key, value in pairs:
                  if key in output:
                      raise DuplicateKeyError(key)
                  output[key] = value
              return output

          def has_conflict_markers(text):
              lines = text.splitlines()
              left = [i for i, line in enumerate(lines) if line.startswith("<<<<<<<")]
              mid = [i for i, line in enumerate(lines) if line == "======="]
              right = [i for i, line in enumerate(lines) if line.startswith(">>>>>>>")]
              for a in left:
                  for b in mid:
                      if b <= a:
                          continue
                      for c in right:
                          if c > b:
                              return True
              return False

          json_checked = 0
          text_checked = 0

          for item in changed:
              status = item.get("status")
              filename = item.get("filename") or ""
              blob_sha = item.get("sha")
              if status == "removed" or not blob_sha:
                  continue

              blob = api_json(f"{api}/repos/{repo}/git/blobs/{blob_sha}")
              if blob.get("encoding") != "base64":
                  failures.append(f"UNSUPPORTED_BLOB_ENCODING:{filename}")
                  continue

              raw = base64.b64decode((blob.get("content") or "").encode("ascii"))
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  continue

              text_checked += 1

              if has_conflict_markers(text):
                  failures.append(f"MERGE_CONFLICT_MARKERS:{filename}")

              if filename.lower().endswith(".json"):
                  json_checked += 1
                  try:
                      json.loads(text, object_pairs_hook=reject_duplicates)
                  except DuplicateKeyError as exc:
                      failures.append(f"DUPLICATE_JSON_KEY:{filename}:{exc}")
                  except json.JSONDecodeError as exc:
                      failures.append(
                          f"INVALID_JSON:{filename}:line={exc.lineno}:column={exc.colno}"
                      )

          result = {
              "authorization": authorization_match.group(1) if authorization_match else None,
              "changed_files": len(changed),
              "head_sha": head_sha,
              "json_files_checked": json_checked,
              "pr_number": pr_number,
              "same_repository_pr": head_repo == repo,
              "text_files_checked": text_checked,
              "failures": failures,
          }
          print("LAB_PUBLICATION_GATE_RESULT=" + json.dumps(result, sort_keys=True))

          if failures:
              sys.exit(1)
          PY